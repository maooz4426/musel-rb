name: Lint
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Debug - Search for rubocop-discourse
        run: |
          echo "=== Checking for rubocop-discourse in repo ==="
          grep -r "rubocop-discourse" . --include="*.yml" --include="*.yaml" || echo "Not found in repo"
          
          echo "=== Checking home directory ==="
          ls -la ~/ | grep rubocop || echo "No rubocop files in home"
          cat ~/.rubocop.yml 2>/dev/null || echo "No ~/.rubocop.yml"
          
          echo "=== Checking for inherited configs ==="
          find . -name ".rubocop*.yml" -type f

      - name: Set up Ruby
        uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 #1.267.0
        with:
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Show RuboCop version and config
        run: |
          bundle exec rubocop --version
          bundle exec rubocop --show-cops || true

      - name: Run RuboCop
        run: bundle exec rubocop